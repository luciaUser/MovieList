<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>MovieByLucia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="add-film">
      <button type="button" id="add-film" aria-expanded="false" aria-controls="add-form">
        <span class="sr">Film ablegen</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="1.6"></path>
        </svg>
      </button>
      <form id="add-form" hidden>
        <label class="sr" for="add-query">Titel oder IMDb-Link</label>
        <input id="add-query" type="text" placeholder="Titel oder IMDb-Link" autocomplete="off" enterkeyhint="done">
        <p id="add-status" role="status"></p>
        <button type="submit">Ablegen</button>
      </form>
    </div>
    <div class="modes" role="tablist" aria-label="Ansicht">
      <button type="button" id="mode-network" role="tab" aria-selected="true">Netzwerk</button>
      <button type="button" id="mode-director" role="tab" aria-selected="false">Regie</button>
      <button type="button" id="mode-rating" role="tab" aria-selected="false">Rating</button>
      <button type="button" id="net-rating" aria-pressed="false">Wertung</button>
    </div>
    <form id="search-form" role="search">
      <label class="sr" for="search">Film suchen</label>
      <input id="search" type="search" placeholder="Film suchen" autocomplete="off" enterkeyhint="search">
      <ul id="results" hidden></ul>
    </form>
  </header>

  <main id="wall" hidden aria-label="Filmcover. Ein Klick öffnet einen Film. Ein Doppelklick markiert ihn als gesehen."></main>
  <div id="network" aria-label="Netzwerk. Ziehen verschiebt die Karte, Scrollen zoomt. Ein Klick öffnet einen Film. Ein Doppelklick markiert ihn als gesehen.">
    <div class="net-world"></div>
  </div>

  <aside id="panel" hidden aria-live="polite"></aside>

  <script src="films.js"></script>
  <script src="facets.js"></script>
  <script src="similarity.config.js"></script>
  <script src="similarity.js"></script>
  <script src="layout.js"></script>
  <script src="network.js"></script>
  <script src="app.js"></script>
</body>
</html>
