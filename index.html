<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>MovieByLucia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="add-film">
      <button type="button" id="add-film" aria-expanded="false" aria-controls="add-form">
        <span class="sr">Film ablegen</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="plus-v" d="M12 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <path d="M4.5 12h15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </button>
      <form id="add-form">
        <div class="line-slot">
          <label class="sr" for="add-query">Titel, IMDb- oder TMDB-Link</label>
          <input id="add-query" type="text" placeholder="Titel oder Link" autocomplete="off" enterkeyhint="done" disabled>
        </div>
        <p id="add-status" role="status"></p>
        <button type="submit" class="sr">Ablegen</button>
      </form>
    </div>
    <div class="modes" role="tablist" aria-label="Ansicht">
      <button type="button" id="mode-profile" class="icon-tab" role="tab" aria-selected="false" aria-label="Profil">
        <span class="icon-glyph" style="--icon: url('icons/profile.png')"></span>
        <span class="profile-dot" hidden></span>
      </button>
      <button type="button" id="mode-rating" class="icon-tab" role="tab" aria-selected="false" aria-label="Rating">
        <span class="icon-glyph" style="--icon: url('icons/rating.png')"></span>
      </button>
      <button type="button" id="mode-network" class="icon-tab" role="tab" aria-selected="true" aria-label="Netzwerk">
        <span class="icon-glyph" style="--icon: url('icons/network.png')"></span>
      </button>
      <div class="sort-wrap">
        <button type="button" id="mode-director" class="icon-tab" role="tab" aria-selected="false" aria-expanded="false" aria-haspopup="true" aria-controls="sort-pop" aria-label="Sortierung">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 10h14M5 14.4h14M5 18.8h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
        </button>
        <div id="sort-pop" aria-hidden="true">
          <button type="button" data-sort="director" aria-pressed="true">Regie</button>
          <button type="button" data-sort="genre" aria-pressed="false">Genre</button>
          <button type="button" data-sort="cast" aria-pressed="false">Schauspieler</button>
        </div>
      </div>
      <button type="button" id="net-rating" aria-pressed="false">Wertung</button>
      <button type="button" id="net-compare" aria-pressed="false" aria-expanded="false">Vergleichen</button>
      <div id="compare-pop" hidden></div>
    </div>
    <form id="search-form" role="search">
      <div class="line-slot">
        <label class="sr" for="search">Film suchen</label>
        <input id="search" type="text" autocomplete="off" enterkeyhint="search" disabled>
      </div>
      <button type="button" id="search-open" aria-expanded="false" aria-controls="search">
        <span class="sr">Film suchen</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M14.6 14.6L20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </button>
      <ul id="results" hidden></ul>
    </form>
  </header>

  <div id="gate" hidden aria-label="Anmeldung">
    <div class="gate-card" id="gate-card"></div>
  </div>
  <section id="profile" hidden aria-label="Profil"></section>
  <main id="wall" hidden aria-label="Filmcover. Ein Klick öffnet einen Film. Ein Doppelklick markiert ihn als gesehen."></main>
  <div id="network" hidden aria-label="Netzwerk. Ziehen verschiebt die Karte, Scrollen zoomt. Ein Klick öffnet einen Film. Ein Doppelklick markiert ihn als gesehen.">
    <div class="net-world"></div>
    <div id="net-bar" hidden></div>
    <div id="compare-bar" hidden><span></span><button type="button" aria-label="Vergleich beenden">×</button></div>
    <div id="empty-net" class="empty" hidden>
      <p>Dein Archiv ist noch leer.</p>
      <button type="button" data-empty="add">Film hinzufügen</button>
      <button type="button" data-empty="list">Liste einfügen</button>
    </div>
  </div>

  <aside id="panel" hidden aria-live="polite"></aside>
  <div id="sheet" hidden>
    <div class="sheet-card" id="sheet-body" role="dialog" aria-modal="true"></div>
  </div>
  <p id="store-note" hidden role="status"></p>
  <div id="wish-hint" hidden></div>

  <script src="config.js"></script>
  <script src="films.js"></script>
  <script src="facets.js"></script>
  <script src="similarity.config.js"></script>
  <script src="similarity.js"></script>
  <script src="layout.js"></script>
  <script src="store.js"></script>
  <script src="network.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
