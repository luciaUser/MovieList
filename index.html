<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>MovieByLucia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="add-film">
      <button type="button" id="add-film" aria-expanded="false" aria-controls="add-form">
        <span class="sr">Film ablegen</span>
        <svg viewBox="0 0 64 48" aria-hidden="true">
          <rect x="3" y="3" width="58" height="42" fill="none" stroke="currentColor" stroke-width="2.5"></rect>
          <path d="M32 14v20M22 24h20" fill="none" stroke="currentColor" stroke-width="2.5"></path>
        </svg>
      </button>
      <form id="add-form" hidden>
        <label class="sr" for="add-query">Titel oder IMDb-Link</label>
        <input id="add-query" type="text" placeholder="Titel oder IMDb-Link" autocomplete="off" enterkeyhint="done">
        <p id="add-status" role="status"></p>
        <button type="submit">Ablegen</button>
      </form>
    </div>
    <div class="modes" role="tablist" aria-label="Ansicht">
      <button type="button" id="mode-genre" role="tab" aria-selected="true">Genre</button>
      <button type="button" id="mode-director" role="tab" aria-selected="false">Regie</button>
      <button type="button" id="mode-rating" aria-pressed="false">Rating</button>
    </div>
    <form id="search-form" role="search">
      <label class="sr" for="search">Film suchen</label>
      <input id="search" type="search" placeholder="Film suchen" autocomplete="off" enterkeyhint="search">
      <ul id="results" hidden></ul>
    </form>
  </header>

  <main id="wall" aria-label="Filmcover. Ein Klick öffnet einen Film. Ein Doppelklick markiert ihn als gesehen."></main>

  <aside id="panel" hidden aria-live="polite"></aside>

  <script src="films.js"></script>
  <script src="app.js"></script>
</body>
</html>
